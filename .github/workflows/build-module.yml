name: Build per-app Spoofer module

on:
  workflow_dispatch:
  push:
    branches: [main, "fix/mlbb-startup-art-compile"]
    paths:
      - "module/**"
      - "module.prop"
      - "system.prop"
      - "target_apps.txt"
      - ".github/workflows/build-module.yml"
  pull_request:
    paths:
      - "module/**"
      - "module.prop"
      - "system.prop"
      - "target_apps.txt"
      - ".github/workflows/build-module.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Android NDK without legacy tools package
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set on this runner}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n1)"
          test -n "$SDKMANAGER"
          # sdkmanager can exit before 'yes' closes its pipe when licenses are already accepted.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "ndk;27.2.12479018"
      - name: Verify NDK installation
        run: |
          test -x "$ANDROID_HOME/ndk/27.2.12479018/ndk-build"
          "$ANDROID_HOME/ndk/27.2.12479018/ndk-build" --version
      - name: Compile Zygisk library
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/ndk-build" \
            -C module \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk
      - name: Assemble installable module ZIP
        run: |
          set -euo pipefail
          mkdir -p dist/Spoofing/zygisk
          cp module.prop system.prop target_apps.txt dist/Spoofing/
          cp module/libs/arm64-v8a/libspoof.so dist/Spoofing/zygisk/arm64-v8a.so
          cp README.md dist/Spoofing/
          cd dist/Spoofing
          zip -r ../../Spoofer-per-app.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Spoofer-per-app
          path: dist/Spoofer-per-app.zip
          if-no-files-found: error
